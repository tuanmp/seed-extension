[project]
name = "ml-cookbook-project"
version = "0.1.0"
description = "Cookbook de prototypage ML avec PyTorch et Lightning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lightning>=2.2,<3.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "numpy>=1.26,<3.0",
  "pyyaml>=6.0,<7.0",
  "colliderml-dataloader @ git+https://github.com/tuanmp/colliderml-dataloader.git",
  "mlflow",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_cookbook", "src/seed_extension"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]