# seed_everything: 42

# fit:
trainer:
  stage_dir: logs
  run_name: cast_pu100
  max_epochs: 500
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  deterministic: true
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0
  val_check_interval: 0.1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 3
        filename: "epoch={epoch:03d}-val_loss={val_loss:.4f}-step={step}"
        verbose: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 3
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
  logger:
    - class_path: lightning.pytorch.loggers.MLFlowLogger
      init_args:
        experiment_name: cast_pu100
        save_dir: ./mlruns
        log_model: true
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: logs
        name: cast_pu100
    

model:
  d_model: 256
  n_cross_attn_layers: 3
  n_heads: 8
  ff_dim: 1024
  dropout: 0.1
  temperature: 0.1
  fourier_L: 8
  use_cylindrical_pe: true
  use_seed_self_attn: true
  hit_encoder: identity
  learning_rate: 1e-4
  weight_decay: 1e-4
  lr_scheduler: cosine
  warmup_steps: 1000
  lambda_seed: 1.0
  lambda_hit: 1.0
  use_null_seed: false

data:
  data_dir: /pscratch/sd/p/pmtuan/.cache/colliderml
  cache_dir: /pscratch/sd/p/pmtuan/.cache/colliderml-feather
  process: ttbar
  pileup: pu200
  max_train_events: 96000
  max_val_events: 2000
  max_test_events: 2000
  batch_size: 1
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  n_seed_hits: 3
  min_track_hits: 5
  min_pT: 0.9
  max_abs_eta: 4.0
  seed_strategy: random_consecutive
  target_vertices: 100
  primary_only: false
  predict_seed_hits: false




